<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCLuz EEG — Treino Interativo Demo</title>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #121729;
      --gold: #FFD700;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --error: #f87171;
      --success: #4ade80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display:   flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #131a2e 0%, var(--bg) 60%);
      font-family: 'Lato', system-ui, -apple-system, sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .sub {
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Formulário */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: #070a12;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--gold);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: #0b0f19;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Caixa de Status / Erros */
    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status-box.error {
      display: block;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .status-box.info {
      display: block;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid var(--gold);
      color: var(--gold);
    }

    /* Painel do Aplicativo EEG (Inicia Escondido) */
    #app-panel {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .eeg-box {
      background: rgba(7, 10, 18, 0.8);
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
    }

    .eeg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .eeg-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .eeg-status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    canvas {
      width: 100%;
      height: 140px;
      background: #04060a;
      border-radius: 8px;
      display: block;
    }

    .app-info {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card"> <!-- CAIXA PRINCIPAL DA INTERFACE -->
    <div class="badge">Demonstração gratuita</div>
    <h1>MCLuz EEG🧠 - Treino Interativo.</h1>
    <p class="sub">Obrigada pela confiança🤓. Preencha seus dados para liberar o treino.</p>

    <!-- FORMULÁRIO -->
   <!-- <form id="login-form">
      <div class="form-group">
        <label for="name">Nome Completo</label>
        <input type="text" id="name" class="form-control" placeholder="Nome" required minlength="3">
      </div> -->
    <form id="login-form">
      <input type="text" id="nome" placeholder="nome" required>
      <input type="email" id="email" placeholder="E-mail" required>
      <button type="submit">Acessar o Treino EEG</button>
    </form>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Telefone / WhatsApp</label>
        <input type="tel" id="phone" class="form-control" placeholder="DDDnúmero telefone" required minlength="10">
      </div>

      <button type="submit" id="btn-submit" class="btn-primary">Acessar Treino EEG</button>
    </form>

     <div id="webview-container">
        <iframe
          src="https://app-treino-eeg.vercel.app/"
          title="Treino EEG Interativo">
          style="width: 100%; height: 400px; border: 1px solid var(--gold); border-radius: 8px;>
        </iframe>
      </div>
    </div> 
  

    <!-- ÁREA DE MENSAGENS -->
    <div id="status-box" class="status-box"></div>

    <!-- PAINEL DO APLICATIVO EEG -->
    <div id="app-panel">
      <div class="eeg-box">
        <div class="eeg-header">
          <span class="eeg-title" id="panel-title">Sinal EEG Ativo</span>
          <span class="eeg-status-dot"></span>
        </div>
        <canvas id="eegCanvas"></canvas>
        <p class="app-info" id="panel-content"></p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const statusBox = document.getElementById('status-box');
      const appPanel = document.getElementById('app-panel');
      const btnSubmit = document.getElementById('btn-submit');
      const panelTitle = document.getElementById('panel-title');
      const panelContent = document.getElementById('panel-content');
      
      let animationId = null;

      function showStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = `status-box ${type}`;
      }

      function hideStatus() {
        statusBox.style.display = 'none';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault(); // Impede o envio padrao do navegador
        
        btnSubmit.disabled = true;
        showStatus('Autenticando no servidor...', 'info');

        const payload = {
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim()
        };

        try {
          // 1. Envia dados para login e geração de Cookie de Sessão
          const authRes = await fetch('/api/access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'same-origin' // Força envio e aceite de cookies
          });

          const authData = await authRes.json();

          if (!authRes.ok || !authData.success) {
            throw new Error(authData.message || 'Falha na autenticação.');
          }

          showStatus('Carregando aplicativo protegido...', 'info');

          // 2. Busca o app protegido validando a sessão
          const response = await fetch('/api/acess', { ... });
            method: 'GET',
            credentials: 'same-origin'
          });

          const dataJson = await dataRes.json();

          if (!dataRes.ok || !dataJson.success) {
            throw new Error(dataJson.message || 'Acesso negado ao app.');
          }

          // 3. LIBERA O APLICATIVO NA TELA
          hideStatus();
          form.style.display = 'none';
          appPanel.style.display = 'block';

          panelTitle.textContent = dataJson.data.title || "Treino EEG Interativo";
          panelContent.textContent = dataJson.data.content || "Conexão estabilizada. Otimizando sinal de ondas cerebrais.";

          // Inicia a renderização do gráfico
          initEEGCanvas();

        } catch (err) {
          console.error("Erro na aplicação:", err);
          showStatus(err.message, 'error');
          btnSubmit.disabled = false;
        }
      });

      // Renderização e animação do gráfico de ondas no Canvas
      function initEEGCanvas() {
        const canvas = document.getElementById('eegCanvas');
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        
        // Ajusta dimensões reais do canvas em pixels
        canvas.width = canvas.offsetWidth || 400;
        canvas.height = canvas.offsetHeight || 140;

        let x = 0;
        let points = [];

        function draw() {
          ctx.fillStyle = '#04060a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Desenha grade de fundo
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.05)';
          ctx.lineWidth = 1;
          for (let i = 0; i < canvas.width; i += 20) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, canvas.height);
            ctx.stroke();
          }

          // Calcula ponto atual da onda EEG
          const centerY = canvas.height / 2;
          const wave = Math.sin(x * 0.08) * 20 + (Math.random() - 0.5) * 15;
          const y = centerY + wave;

          points.push({ x: x, y: y });

          if (points.length > canvas.width / 2) {
            points.shift();
            // Move os pontos para trás
            points.forEach(p => p.x -= 2);
          }

          // Desenha a linha amarela/dourada do EEG
          ctx.strokeStyle = '#FFD700';
          ctx.lineWidth = 2;
          ctx.beginPath();

          for (let i = 0; i < points.length; i++) {
            if (i === 0) ctx.moveTo(points[i].x, points[i].y);
            else ctx.lineTo(points[i].x, points[i].y);
          }
          ctx.stroke();

          x += 2;
          animationId = requestAnimationFrame(draw);
        }

        if (animationId) cancelAnimationFrame(animationId);
        draw();
      }
    });
  </script>
</body>
</html>

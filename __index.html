<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCLuz EEG — Treino Interativo Demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f19;
    --panel: #121729;
    --panel-alt: #171d33;
    --blue: #38bdf8;
    --purple: #c084fc;
    --gold: #FFD700;
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --green: #34d399;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #131a2e 0%, var(--bg) 60%);
    font-family: 'Lato', system-ui, -apple-system, sans-serif;
    color: var(--text);
    padding: 20px;
  }
  .card { width: 100%; max-width: 480px; background: var(--panel); border: 1px solid rgba(56,189,248,0.2); border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 16px;
  }
  h1 { font-family: 'Playfair Display', serif; font-size: 24px; margin: 0 0 8px; line-height: 1.3; }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
  .form-frame-wrap {
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
  }
  iframe.gform {
    width: 100%;
    height: 480px;
    border: none;
    display: block;
  }
  .wa-note { color: var(--text-dim); font-size: 13px; margin: 18px 0 6px; text-align: center; }
  .wa-btn {
    display: block;
    text-align: center;
    background: var(--panel-alt);
    color: var(--gold);
    text-decoration: none;
    border: 1.5px solid var(--gold);
    padding: 14px 20px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    transition: background 0.2s, color 0.2s;
  }

</head>
</html>
